<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diccionario Fénix Python</title>
<style>
:root{--bg:#0b1220;--panel:#111a2b;--panel2:#172236;--text:#eaf0f7;--muted:#9fb0c3;--accent:#67b7ff;--border:#263750;--good:#a6e3a1}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
header{padding:14px 18px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,#0f1a2d,#0b1220);position:sticky;top:0;z-index:20}
.wrap{max-width:1180px;margin:0 auto}
h1{margin:0 0 6px;font-size:clamp(22px,2.5vw,30px)}
.subtitle{color:var(--muted);margin:0 0 10px}
nav{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 14px}
nav a{color:var(--text);text-decoration:none;border:1px solid var(--border);padding:9px 13px;border-radius:999px;background:var(--panel)}
nav a.active{border-color:var(--accent);color:var(--accent)}
.controls{display:grid;grid-template-columns:1fr 230px;gap:10px}
input,select{width:100%;padding:14px 15px;border-radius:12px;border:1px solid var(--border);background:var(--panel);color:var(--text);font-size:16px;outline:none}
input:focus,select:focus{border-color:var(--accent)}
main{padding:14px 18px}.stats{color:var(--muted);margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.14)}
.badge{display:inline-block;font-size:12px;color:#c9dcf2;background:var(--panel2);border:1px solid var(--border);border-radius:999px;padding:5px 9px;margin-bottom:10px}
.term{font-size:21px;font-weight:750;margin-bottom:4px}.es{color:var(--accent);margin-bottom:12px}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:10px}
.value{margin-top:3px;line-height:1.45}.signal{margin-top:4px;display:inline-block;color:var(--good);font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.footer-note{color:var(--muted);font-size:13px;margin:22px 0 8px}
@media(max-width:700px){.controls{grid-template-columns:1fr}header{position:static}}
</style>
</head>
<body>
<header><div class="wrap">
<h1>Diccionario Fénix Python</h1>
<p class="subtitle">Conceptos trabajados en Fénix Academia · definición, ejemplo y relación práctica.</p>
<nav><a href="./">Azure</a><a class="active" href="python.html">Python</a><a href="glosario-media.html">Audio y video del glosario</a><a href="preguntas.html">Preguntas 1–200</a></nav>
<div class="controls">
<input id="q" type="search" placeholder="Buscar: %, return, división, comparación, and..." autocomplete="off">
<select id="cat"><option value="">Todas las categorías</option><option>Fundamentos</option><option>Tipos de datos</option><option>Entrada y salida</option><option>Conversiones</option><option>Operadores</option><option>Funciones y flujo</option><option>Texto</option><option>Buenas prácticas</option></select>
</div></div></header>
<main><div class="wrap"><div id="stats" class="stats"></div><div id="grid" class="grid"></div>
<div class="footer-note">Base inicial consolidada: fundamentos, tipos, entrada/salida, conversiones, operadores, funciones, texto y buenas prácticas.</div>
</div></main>
<script>
const entries=[
["Operadores","=","Asignación","Asigna un valor a una variable.","Guarda un valor bajo un nombre.","puerto = 22","No confundir con ==, que compara.","APLICADO"],
["Operadores","==","Comparación de igualdad","Compara dos valores y devuelve True si son iguales.","Pregunta: ¿estos dos valores son iguales?","puerto == 22","No confundir con =, que asigna.","APLICADO"],
["Operadores","!=","Distinto de","Compara dos valores y devuelve True si son diferentes.","Pregunta: ¿esto no es igual a aquello?","number != 10","Es la comparación opuesta a ==.","APLICADO"],
["Operadores",">","Mayor que","Devuelve True si el valor izquierdo es mayor que el derecho.","Se lee: a es mayor que b.","latencia > 100","La punta del símbolo queda hacia el valor menor.","APLICADO"],
["Operadores","<","Menor que","Devuelve True si el valor izquierdo es menor que el derecho.","Se lee: a es menor que b.","number < 12","La punta del símbolo queda hacia el valor menor.","APLICADO"],
["Operadores",">=","Mayor o igual que","Devuelve True si el valor izquierdo es mayor o igual que el derecho.","Acepta el límite y cualquier valor superior.","uso >= 90","A diferencia de >, incluye el límite.","APLICADO"],
["Operadores","<=","Menor o igual que","Devuelve True si el valor izquierdo es menor o igual que el derecho.","Acepta el límite y cualquier valor inferior.","uso <= 100","A diferencia de <, incluye el límite.","COMPRENDIDO"],
["Operadores","+","Suma / concatenación","Suma números o une cadenas de texto compatibles.","Con números suma; con texto puede unir cadenas.","total = bill + tip","Para unir texto con número puede requerirse str().","APLICADO"],
["Operadores","*","Multiplicación","Multiplica valores numéricos.","Calcula cuántas veces se toma una cantidad.","tip = bill * 0.15","No confundir con **, que calcula potencias.","APLICADO"],
["Operadores","/","División normal","Divide dos valores y normalmente produce un float.","Reparte una cantidad y conserva la parte decimal.","10 / 10  # 1.0","A diferencia de //, conserva la parte decimal.","APLICADO"],
["Operadores","//","División entera / floor division","Divide y devuelve el cociente redondeado hacia abajo.","Dice cuántas veces cabe completamente un valor dentro de otro.","full_blocks = filesize // block_size","No es lo mismo que /.","APLICADO"],
["Operadores","%","Módulo","Devuelve el resto de una división.","Permite saber si después de dividir todavía sobra algo.","partial_block_remainder = filesize % block_size","No devuelve el cociente; devuelve el resto.","APLICADO"],
["Operadores","**","Potencia","Eleva un número a una potencia.","Multiplica una base por sí misma según el exponente.","2 ** 2  # 4","No confundir con *.","APLICADO"],
["Operadores","and","Y lógico","Devuelve True cuando ambas condiciones son verdaderas.","Tiene que cumplirse esto y también esto.","edad >= 18 and edad <= 65","Con or basta una condición verdadera.","APLICADO"],
["Operadores","or","O lógico","Devuelve True si al menos una condición es verdadera.","Basta con que ocurra una cosa o la otra.","valor < 0 or valor > 100","Con and deben cumplirse ambas.","APLICADO"],
["Operadores","not","Negación lógica","Invierte el valor booleano de una expresión.","Convierte True en False y False en True.","not activo","No compara dos valores; niega una condición.","APLICADO"],
["Funciones y flujo","def","Definir una función","Palabra clave que inicia la definición de una función.","Le dice a Python: aquí voy a crear una función con este nombre.","def evaluar_disco(valor):","Definir no ejecuta la función; para ejecutarla hay que llamarla.","APLICADO"],
["Funciones y flujo","Función","Bloque reutilizable de código","Agrupa instrucciones bajo un nombre para poder ejecutarlas cuando sea necesario.","Es como guardar un procedimiento para usarlo cada vez que lo necesites.","def convertir_distancia(km): ...","No confundir con una llamada: definir crea la función; llamar la ejecuta.","APLICADO"],
["Funciones y flujo","Parámetro","Nombre que recibe un valor dentro de una función","Variable declarada en la definición de una función que representa el dato que recibirá.","Es el nombre del espacio donde la función espera recibir un dato.","def greeting(name):","El parámetro aparece en la definición; el argumento aparece en la llamada.","APLICADO"],
["Funciones y flujo","Argumento","Valor enviado a una función","Dato concreto que se entrega cuando se llama a una función.","Es el valor real que entra al parámetro.","greeting(\"Taylor\")","No confundir con parámetro: Taylor es argumento; name es parámetro.","APLICADO"],
["Funciones y flujo","Llamada de función","Ejecutar una función","Usar el nombre de una función seguido de paréntesis para ejecutarla.","La función ya existe; ahora le digo que trabaje.","convert_distance(my_trip_kilometers)","Definir con def no ejecuta; la llamada sí.","APLICADO"],
["Funciones y flujo","return","Retornar un valor","Devuelve un resultado desde una función y termina su ejecución en ese punto.","La función entrega su respuesta y termina su trabajo.","return \"Alerta\"","No confundir con print(): print muestra; return entrega un valor al programa.","APLICADO"],
["Funciones y flujo","if","Condición principal","Ejecuta un bloque si una condición es True.","Si esto se cumple, haz esto.","if puerto == 22:","Solo evalúa su bloque cuando la condición es verdadera.","APLICADO"],
["Funciones y flujo","elif","Condición alternativa","Evalúa otra condición cuando las anteriores fueron False.","Si lo anterior no se cumplió, prueba esta otra condición.","elif uso >= 80:","Se evalúa de arriba hacia abajo y se detiene en la primera rama verdadera.","APLICADO"],
["Funciones y flujo","else","Caso restante","Ejecuta un bloque cuando ninguna condición anterior fue verdadera.","Si nada de lo anterior ocurrió, haz esto.","else:","No lleva condición propia.","APLICADO"],
["Funciones y flujo","Flujo de decisión","Orden de evaluación de condiciones","Python evalúa if y elif de arriba hacia abajo y toma la primera rama verdadera.","Python revisa las condiciones en orden y entra en la primera que se cumple.","if ... elif ... else","El orden de las condiciones puede cambiar el resultado.","APLICADO"],
["Funciones y flujo","Variable local","Variable disponible dentro de una función","Variable creada dentro de una función y accesible normalmente solo dentro de ella.","Es una variable que vive dentro del trabajo de esa función.","m = km * 1000","Una variable local no se usa directamente fuera de la función.","APLICADO"],
["Fundamentos","Variable","Nombre que referencia un valor","Permite guardar un dato bajo un nombre para reutilizarlo.","Es una etiqueta que apunta a un valor.","puerto = 22","La variable es el nombre; 22 es el valor.","APLICADO"],
["Fundamentos","Valor","Dato almacenado o producido","Es la información concreta que una expresión o variable representa.","Es el contenido que estamos usando.","uso = 85","No confundir con el nombre de la variable.","APLICADO"],
["Fundamentos","Expresión","Combinación que produce un valor","Puede incluir valores, variables, operadores y llamadas de función.","Es una parte del código que Python puede calcular.","2 ** 2","Una expresión produce un resultado; una instrucción puede realizar una acción.","COMPRENDIDO"],
["Fundamentos","Condición","Expresión evaluada como True o False","Se usa para decidir qué camino debe seguir el programa.","Es una pregunta que Python responde con verdadero o falso.","uso >= 90","Se utiliza en if, elif y otras estructuras de control.","APLICADO"],
["Fundamentos","Sintaxis","Reglas de escritura del lenguaje","Define cómo debe escribirse el código para que Python pueda interpretarlo.","Es la gramática del código.","if uso >= 90:","Un error de sintaxis impide que Python entienda la estructura.","APLICADO"],
["Fundamentos","Semántica","Significado del código","Describe qué hace realmente una instrucción aunque esté bien escrita.","Es entender qué significa el código, no solo escribirlo correctamente.","total = bill + tip","Un código puede tener sintaxis válida y una lógica incorrecta.","APLICADO"],
["Fundamentos","Indentación","Sangría que define bloques","Los espacios al inicio de una línea indican qué instrucciones pertenecen a un bloque.","Le muestra a Python qué líneas van juntas.","if activo:\n    print(\"OK\")","En Python la indentación forma parte de la estructura del programa.","APLICADO"],
["Tipos de datos","int","Número entero","Tipo de dato para números sin parte decimal.","Representa números completos.","edad = 51","No contiene decimales como float.","APLICADO"],
["Tipos de datos","float","Número decimal","Tipo de dato numérico que puede incluir parte decimal.","Sirve cuando necesitamos decimales.","latencia = 12.5","No confundir con int.","APLICADO"],
["Tipos de datos","str","Cadena de texto","Tipo de dato usado para representar texto.","Es texto entre comillas.","nombre = \"Felipe\"","No se suma numéricamente con int o float sin conversión.","APLICADO"],
["Tipos de datos","bool","Booleano","Tipo lógico que solo puede ser True o False.","Representa una respuesta de sí o no para Python.","activo = True","Se usa frecuentemente en condiciones.","APLICADO"],
["Tipos de datos","True","Verdadero","Valor booleano que representa una condición verdadera.","Significa que la condición se cumple.","puerto == 22  # True","Es un valor bool, no texto.","APLICADO"],
["Tipos de datos","False","Falso","Valor booleano que representa una condición falsa.","Significa que la condición no se cumple.","10 > 20  # False","Es un valor bool, no texto.","APLICADO"],
["Entrada y salida","input()","Entrada de usuario","Lee texto introducido por el usuario y devuelve un str.","Es la forma de pedirle un dato al usuario.","uso = input(\"Ingresa uso de disco: \")","input() devuelve texto aunque el usuario escriba números.","APLICADO"],
["Entrada y salida","print()","Salida en pantalla","Muestra valores o mensajes en la salida estándar.","Sirve para mostrar información.","print(\"Estado:\", estado)","print muestra; return devuelve un valor desde una función.","APLICADO"],
["Conversiones","int()","Convertir a entero","Convierte un valor compatible al tipo int.","Transforma un texto numérico en número entero.","uso = int(uso)","Falla si el contenido no puede convertirse a entero.","APLICADO"],
["Conversiones","float()","Convertir a decimal","Convierte un valor compatible al tipo float.","Transforma un dato numérico en número con decimales.","latencia = float(\"12.5\")","No es lo mismo que int(), que elimina la parte decimal al convertir desde float.","COMPRENDIDO"],
["Conversiones","str()","Convertir a texto","Convierte un valor a cadena de texto.","Permite tratar un número como texto.","str(share)","Útil al concatenar texto con números.","APLICADO"],
["Conversiones","Conversión explícita","Conversión solicitada por el programador","El código llama directamente a int(), float(), str() u otra función de conversión.","Yo le digo a Python que cambie el tipo.","uso = int(input(\"Uso: \"))","No es automática; aparece escrita en el código.","APLICADO"],
["Conversiones","Conversión implícita","Conversión automática compatible","Python convierte ciertos tipos automáticamente durante una operación.","Python ajusta el tipo sin que yo lo escriba.","10 + 2.5  # 12.5","Solo ocurre entre tipos compatibles.","COMPRENDIDO"],
["Texto","String","Cadena de caracteres","Secuencia de caracteres representada por el tipo str.","Es cualquier texto que Python trata como una unidad.","mensaje = \"Servidor activo\"","String y str se refieren al mismo concepto general.","APLICADO"],
["Texto","Concatenación","Unión de cadenas","Combina varias cadenas de texto en una sola.","Es pegar textos uno después del otro.","\"Hola \" + nombre","Los valores no str pueden requerir conversión antes de concatenar.","APLICADO"],
["Texto","Comparación lexicográfica","Comparación de texto por orden de caracteres","Python compara strings carácter por carácter según su orden.","Es parecido a ordenar palabras alfabéticamente, respetando el orden de caracteres.","\"A dog\" < \"A mouse\"","No compara longitud del texto.","APLICADO"],
["Buenas prácticas","Comentario #","Comentario de una línea","Texto explicativo que Python ignora al ejecutar el programa.","Es una nota para humanos dentro del código.","# Validar rango permitido","No reemplaza nombres claros ni buena estructura.","APLICADO"],
["Buenas prácticas","Nombre descriptivo","Nombre que expresa intención","Usar nombres claros facilita entender y mantener el código.","El nombre debería explicar para qué sirve el dato.","partial_block_remainder = filesize % block_size","Evita nombres de una sola letra salvo contextos simples.","COMPRENDIDO"],
["Buenas prácticas","Reutilización de código","Usar lógica existente en lugar de duplicarla","Las funciones permiten centralizar lógica que se necesita varias veces.","Es mejor escribir una función una vez y llamarla cuando haga falta.","estado = evaluar_disco(85)","Reduce duplicación y facilita cambios futuros.","COMPRENDIDO"],
["Buenas prácticas","Código duplicado","Lógica repetida innecesariamente","Ocurre cuando se copian varias veces las mismas instrucciones en lugar de reutilizarlas.","Si repito lo mismo muchas veces, probablemente puedo convertirlo en función.","# repetir la misma validación en varios lugares","Conviene reducirlo mediante funciones u otras estructuras reutilizables.","VISTO"],
["Buenas prácticas","Validación de entrada","Comprobar que un dato sea aceptable","Verifica rangos, formatos o condiciones antes de usar un valor.","Es revisar si el dato tiene sentido antes de continuar.","if valor < 0 or valor > 100:","No es lo mismo que convertir el tipo; ambas cosas pueden ser necesarias.","APLICADO"]
].map(x=>({category:x[0],term:x[1],es:x[2],meaning:x[3],feynman:x[4],example:x[5],compare:x[6],status:x[7]}));
function norm(s){return(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
function render(){
 const q=norm(document.getElementById("q").value.trim()),cat=document.getElementById("cat").value;
 const filtered=entries.filter(e=>{const hay=norm([e.term,e.es,e.meaning,e.feynman,e.example,e.compare,e.status,e.category].join(" "));return(!q||hay.includes(q))&&(!cat||e.category===cat)});
 document.getElementById("stats").textContent=`${filtered.length} término${filtered.length===1?"":"s"} encontrado${filtered.length===1?"":"s"}`;
 document.getElementById("grid").innerHTML=filtered.map(e=>`<article class="card"><div class="badge">Python · ${e.category}</div><div class="term">${e.term}</div><div class="es">${e.es}</div><div class="label">Qué significa</div><div class="value">${e.meaning}</div><div class="label">Feynman</div><div class="value">${e.feynman}</div><div class="label">Ejemplo</div><div class="signal">${e.example}</div><div class="label">No confundir con</div><div class="value">${e.compare}</div><div class="label">Estado</div><div class="value"><strong>${e.status}</strong></div></article>`).join("");
}
document.getElementById("q").addEventListener("input",render);document.getElementById("cat").addEventListener("change",render);render();
</script>
</body>
</html>

<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Laboratorio Troubleshooting TI Fénix</title><style>
:root{--bg:#0b1220;--panel:#111a2b;--panel2:#172236;--text:#eaf0f7;--muted:#9fb0c3;--accent:#67b7ff;--border:#263750;--good:#a6e3a1;--warn:#ffd166}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
header{padding:14px 18px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,#0f1a2d,#0b1220)}.wrap{max-width:1050px;margin:auto}
h1{margin:0 0 6px;font-size:clamp(24px,3vw,34px)}.sub,.muted{color:var(--muted)}nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
nav a,.btn,select{color:var(--text);text-decoration:none;border:1px solid var(--border);padding:10px 13px;border-radius:10px;background:var(--panel2);cursor:pointer}
nav a.active{border-color:var(--accent);color:var(--accent)}main{padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px}.meta{font-size:13px;color:var(--muted);margin-bottom:10px}
.prompt{font-size:19px;line-height:1.5}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.hint,.answer{display:none;margin-top:12px;padding:12px;border-radius:10px;background:#0b1524;border-left:3px solid var(--warn);white-space:pre-wrap}
.answer{border-left-color:var(--good)}textarea{width:100%;min-height:190px;background:#09101c;color:var(--text);border:1px solid var(--border);border-radius:12px;padding:12px;font:15px/1.5 Consolas,monospace}
.note{font-size:13px;color:var(--muted);line-height:1.5}@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style></head><body><header><div class="wrap"><h1>Laboratorio Troubleshooting TI Fénix</h1><p class="sub">Casos reales para practicar hipótesis, diagnóstico, acción y verificación.</p>
<nav><a href="./">Inicio</a><a href="labs.html">Laboratorios</a><a href="english-lab.html">Inglés TI</a><a class="active" href="troubleshooting-lab.html">Troubleshooting</a><a href="network-lab.html">Redes</a><a href="powershell-lab.html">PowerShell</a><a href="python-lab.html">Python</a></nav></div></header>
<main><div class="wrap"><div class="grid"><section class="card"><div class="meta"><span id="count"></span> · <span id="area"></span> · <span id="level"></span></div>
<div id="prompt" class="prompt"></div><div class="actions"><button class="btn" id="next">Otro ejercicio</button><button class="btn" id="hintBtn">Pista</button><button class="btn" id="answerBtn">Ver referencia</button></div>
<div id="hint" class="hint"></div><div id="answer" class="answer"></div><p class="note">Primero responde por tu cuenta. La referencia sirve para comparar, no para reemplazar tu razonamiento.</p></section>
<section class="card"><h2>Tu respuesta</h2><textarea id="work" placeholder="Escribe aquí tu respuesta, comando, diagnóstico o razonamiento..."></textarea><div class="actions"><button class="btn" id="clear">Limpiar</button></div></section></div></div></main>
<script>const items=[{"area":"Conectividad","level":"Básico","prompt":"Un PC no tiene Internet. Tiene IP 169.254.x.x. ¿Cuál es tu primera hipótesis y qué verificarías?","hint":"Piensa en DHCP antes de DNS.","answer":"Hipótesis: no obtuvo una concesión DHCP. Verificar enlace físico/Wi‑Fi, adaptador, ipconfig /all, alcance DHCP y conectividad hasta el servidor DHCP."},{"area":"DNS","level":"Medio","prompt":"El usuario puede abrir 8.8.8.8 pero no google.com. Diagnostica.","hint":"IP funciona, nombre no.","answer":"La conectividad IP existe; el problema apunta a resolución DNS. Revisaría servidores DNS configurados, nslookup y acceso al DNS interno/externo."},{"area":"AD","level":"Medio","prompt":"Un usuario inicia sesión localmente, pero no puede acceder a recursos del dominio. ¿Qué separarías en el diagnóstico?","hint":"Autenticación local ≠ autenticación de dominio.","answer":"Verificaría pertenencia al dominio, DNS hacia el DC, hora, conectividad con DC, credenciales de dominio y tickets/autenticación."},{"area":"Servicios","level":"Medio","prompt":"systemctl muestra un servicio active (running), pero la aplicación no responde. ¿Está resuelto?","hint":"Estado del proceso no demuestra objetivo funcional.","answer":"No. Verificaría puerto de escucha, logs, dependencias, acceso local/remoto y una prueba funcional real de la aplicación."},{"area":"Archivos","level":"Medio","prompt":"Un usuario ve el share pero recibe Access Denied. ¿Qué revisarías?","hint":"Permisos de recurso compartido y del sistema de archivos.","answer":"Identidad efectiva, grupos, permisos share, ACL del sistema de archivos, herencia, ruta correcta y caché/tokens de sesión."},{"area":"Rendimiento","level":"Básico","prompt":"Un PC está muy lento. CPU 10%, RAM 95%, disco 5%. ¿Qué componente priorizas y por qué?","hint":"Busca el recurso saturado.","answer":"RAM. El 95% sugiere presión de memoria; revisaría procesos, paginación y tendencia antes de cambiar hardware."},{"area":"Red","level":"Desafío","prompt":"PC A llega al gateway; PC B no. Ambos están en la misma oficina. Propón una secuencia corta de diagnóstico.","hint":"Compara capas y configuración entre ambos.","answer":"Comparar enlace, IP/máscara/gateway, VLAN/puerto de switch, ARP y ping local. Usar PC A como referencia para aislar si el fallo está en host, puerto o segmento."},{"area":"Impresión","level":"Básico","prompt":"La impresora está encendida y responde ping, pero nadie imprime. ¿Qué verificas después?","hint":"Red disponible no implica servicio de impresión disponible.","answer":"Cola/spooler, puerto configurado, driver, trabajos atascados, prueba desde otro equipo y estado del servicio/servidor de impresión."},{"area":"Seguridad","level":"Medio","prompt":"Aparecen pop-ups y procesos desconocidos en un PC. ¿Cuál es la prioridad?","hint":"Contención antes de limpieza extensa.","answer":"Contener el equipo, reducir propagación, preservar evidencia relevante, evaluar alcance y luego limpiar/recuperar. Evitar seguir usando credenciales sensibles."},{"area":"Servidor","level":"Desafío","prompt":"Tras un cambio de DNS, varios equipos no encuentran el DC. ¿Qué evidencia buscarías antes de revertir?","hint":"Configuración cliente + registros DNS + resolución.","answer":"ipconfig /all, nslookup del dominio/DC, registros A/SRV, DNS configurado en clientes, logs y alcance del cambio. Si el cambio es causal, revertir de forma controlada."},{"area":"Wi‑Fi","level":"Medio","prompt":"El Wi‑Fi cae solo en una zona y por momentos. ¿Qué hipótesis priorizarías?","hint":"Cobertura, interferencia, AP, roaming.","answer":"Cobertura/interferencia, saturación o fallo del AP, canal, alimentación y roaming. Compararía señal, canal y comportamiento en zonas sanas."},{"area":"Disco","level":"Medio","prompt":"Un servidor tiene 98% del disco lleno. ¿Borrar archivos es la primera acción?","hint":"Primero identifica qué creció y por qué.","answer":"No. Identificaría consumo por ruta/proceso, logs, backups, temporales y crecimiento anormal. Luego liberaría espacio de forma segura y corregiría la causa."},{"area":"Cambio","level":"Desafío","prompt":"Después de modificar una GPO aparece un problema. ¿Cómo compruebas causalidad?","hint":"Tiempo, alcance, gpresult y comparación.","answer":"Confirmar qué equipos/usuarios recibieron la GPO, gpresult/RSOP, hora del cambio, diferencias con equipos no afectados y prueba controlada/reversión."},{"area":"Incidente","level":"Básico","prompt":"¿Cuándo puedes declarar resuelto un incidente?","hint":"No basta con comando exitoso.","answer":"Cuando el objetivo funcional esté restaurado y verificado con una prueba relevante, no solo cuando un servicio o comando aparezca correcto."},{"area":"Método Fénix","level":"Medio","prompt":"Ordena: Acción, Hipótesis, Conclusión, Problema, Verificación, Diagnóstico.","hint":"Empieza por entender qué falla.","answer":"Problema → Hipótesis → Diagnóstico → Acción → Verificación → Conclusión."}];let current=0;function show(i){current=i;const x=items[i];count.textContent='Ejercicio '+(i+1)+'/'+items.length;area.textContent=x.area;level.textContent=x.level;prompt.textContent=x.prompt;hint.textContent=x.hint;answer.textContent=x.answer;hint.style.display='none';answer.style.display='none';hintBtn.textContent='Pista';answerBtn.textContent='Ver referencia'}show(0);
next.onclick=()=>{let n=current;while(items.length>1&&n===current)n=Math.floor(Math.random()*items.length);show(n)};
hintBtn.onclick=()=>{const on=hint.style.display==='block';hint.style.display=on?'none':'block';hintBtn.textContent=on?'Pista':'Ocultar pista'};
answerBtn.onclick=()=>{const on=answer.style.display==='block';answer.style.display=on?'none':'block';answerBtn.textContent=on?'Ver referencia':'Ocultar referencia'};
clear.onclick=()=>{work.value=''};</script></body></html>

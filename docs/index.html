<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Glosario Fénix Azure</title><style>:root{--bg:#0b1220;--panel:#111a2b;--panel2:#172236;--text:#eaf0f7;--muted:#9fb0c3;--accent:#67b7ff;--border:#263750;--good:#a6e3a1}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}header{padding:14px 18px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,#0f1a2d,#0b1220);position:sticky;top:0;z-index:20}.wrap{max-width:1180px;margin:0 auto}h1{margin:0 0 6px;font-size:clamp(22px,2.5vw,30px)}nav{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 14px}nav a{color:var(--text);text-decoration:none;border:1px solid var(--border);padding:9px 13px;border-radius:999px;background:var(--panel)}nav a.active{border-color:var(--accent);color:var(--accent)}.controls{display:grid;grid-template-columns:1fr 230px;gap:10px}input,select{width:100%;padding:14px 15px;border-radius:12px;border:1px solid var(--border);background:var(--panel);color:var(--text);font-size:16px;outline:none}input:focus,select:focus{border-color:var(--accent)}main{padding:14px 18px}.stats{color:var(--muted);margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.14)}.badge{display:inline-block;font-size:12px;color:#c9dcf2;background:var(--panel2);border:1px solid var(--border);border-radius:999px;padding:5px 9px;margin-bottom:10px}.term{font-size:19px;font-weight:750;margin-bottom:4px}.es{color:var(--accent);margin-bottom:12px}.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:10px}.value{margin-top:3px;line-height:1.45}.signal{margin-top:4px;display:inline-block;color:var(--good);font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.empty{color:var(--muted);padding:35px 0;text-align:center}.footer-note{color:var(--muted);font-size:13px;margin:22px 0 8px}@media(max-width:700px){.controls{grid-template-columns:1fr}header{position:static}}</style></head><body><header><div class="wrap"><h1>Glosario Fénix Azure</h1><nav><a class="active" href="./">Glosario</a><a href="glosario-media.html">Audio y video del glosario</a><a href="preguntas.html">Preguntas 1–200</a></nav><div class="controls"><input id="q" type="search" placeholder="Buscar término, concepto o pista: Hot, Storage, outage, billing, MFA..." autocomplete="off"><select id="cat"><option value="">Todas las categorías</option><option>Azure Storage</option><option>Azure architecture</option><option>Cloud concepts</option><option>Cloud service models</option><option>Governance</option><option>Identity and Access</option><option>Management tools</option><option>Monitoring and Support</option><option>Networking</option></select></div></div></header><main><div class="wrap"><div id="stats" class="stats"></div><div id="grid" class="grid"></div><div class="footer-note">Consejo: busca también por la pista de examen, por ejemplo “outage”, “billing”, “more VMs”, “sign in once”, “secondary region” o “assign permissions”.</div></div></main><script>
const entries=[
["Cloud concepts","Scalability","Escalabilidad","Capacidad de aumentar o reducir recursos.","capacity, growth, demand","No implica necesariamente ajuste automático."],
["Cloud concepts","Horizontal scaling / Scale out","Escalado horizontal","Agregar más instancias o máquinas.","more instances, more VMs","Más máquinas, no más potencia a una sola VM."],
["Cloud concepts","Vertical scaling / Scale up","Escalado vertical","Aumentar CPU o RAM de una misma máquina.","more CPU, more RAM","Más potencia a la misma máquina."],
["Cloud concepts","Elasticity","Elasticidad","Ajustar recursos dinámicamente según la demanda.","automatically, demand increases/decreases","A diferencia de Scalability, destaca el ajuste dinámico."],
["Cloud concepts","Agility","Agilidad","Crear o modificar recursos rápidamente.","deploy quickly, business requirements","No es aumentar capacidad; es rapidez para desplegar o cambiar."],
["Cloud concepts","High Availability","Alta disponibilidad","Mantener un servicio disponible aunque haya fallos.","downtime, remains available","No es recuperación después de un desastre."],
["Cloud concepts","Disaster Recovery","Recuperación ante desastres","Recuperar servicios y datos después de un desastre.","disaster, recovery, backup","Se centra en recuperación, no solo en continuidad inmediata."],
["Cloud concepts","Geo-distribution","Distribución geográfica","Distribuir recursos o datos en distintas ubicaciones.","around the world, regions","Busca cercanía, rendimiento o resiliencia geográfica."],
["Cloud service models","IaaS","Infraestructura como servicio","Azure entrega infraestructura; el cliente administra OS, aplicaciones y datos.","VM, OS responsibility","Más control del cliente."],
["Cloud service models","PaaS","Plataforma como servicio","Azure administra la plataforma; el cliente se concentra en aplicación y datos.","application development, no server management","Menos administración de infraestructura que IaaS."],
["Cloud service models","SaaS","Software como servicio","El cliente usa una aplicación ya preparada y administrada por el proveedor.","existing application, use software","Menor responsabilidad técnica del cliente."],
["Azure architecture","Resource","Recurso","Elemento individual administrable de Azure.","VM, VNet, Storage Account","Es el objeto individual, no el contenedor."],
["Azure architecture","Resource Group","Grupo de recursos","Agrupación lógica de recursos relacionados.","group related resources","Está dentro de una Subscription."],
["Azure architecture","Subscription","Suscripción","Límite administrativo y de facturación.","billing, invoice","Contiene Resource Groups."],
["Azure architecture","Management Group","Grupo de administración","Agrupa varias subscriptions para gobernanza común.","multiple subscriptions","Está por encima de Subscription."],
["Azure architecture","Azure Resource Manager (ARM)","Azure Resource Manager","Capa de despliegue y administración de recursos de Azure.","deploy, manage resources","No es identidad ni monitorización."],
["Azure architecture","Availability Zone","Zona de disponibilidad","Datacenter físicamente separado dentro de una región.","datacenter failure, same region","Protege dentro de una región."],
["Azure architecture","Region Pair","Par de regiones","Relación entre dos regiones para resiliencia regional.","regional disaster, secondary region","Piensa en fallo de una región completa."],
["Networking","Virtual Network (VNet)","Red virtual","Red privada lógica dentro de Azure.","Azure network, private network","Base de conectividad entre recursos Azure."],
["Networking","VNet Peering","Emparejamiento de redes virtuales","Conecta dos VNets para que sus recursos se comuniquen.","two VNets communicate","No filtra tráfico; conecta VNets."],
["Networking","VPN Gateway","Puerta de enlace VPN","Conecta redes mediante VPN, por ejemplo on-premises con Azure.","on-premises ↔ Azure, VPN","Usa túneles VPN."],
["Networking","ExpressRoute","ExpressRoute","Conexión privada dedicada entre on-premises y Azure.","dedicated, private connection","No depende de una VPN por Internet."],
["Networking","Network Security Group (NSG)","Grupo de seguridad de red","Filtra tráfico de red con reglas de entrada y salida.","allow/deny traffic, ports","Controla tráfico; no conecta redes."],
["Azure Storage","LRS","Locally Redundant Storage","Mantiene varias copias de los datos dentro de una única ubicación física de la región.","local redundancy, same datacenter","No protege frente a la pérdida completa de una zona o región."],
["Azure Storage","ZRS","Zone-Redundant Storage","Replica los datos entre varias zonas de disponibilidad dentro de la misma región.","multiple zones, same region","Protege frente a la caída de una zona, no de toda la región."],
["Azure Storage","GRS","Geo-Redundant Storage","Replica los datos en la región primaria y también en una región secundaria emparejada.","secondary region, disaster recovery","La copia secundaria no ofrece lectura normal al cliente mientras se mantiene GRS."],
["Azure Storage","RA-GRS","Read-Access Geo-Redundant Storage","Ofrece replicación geográfica como GRS y además permite lectura desde la región secundaria.","read secondary region","La pista clave es necesitar acceso de lectura al secundario."],
["Azure Storage","Hot tier","Nivel Hot / puede aparecer traducido","Datos de acceso frecuente.","frequently accessed, fast access","Mayor costo de almacenamiento, menor costo de acceso que tiers fríos."],
["Azure Storage","Cool tier","Nivel Cool / puede aparecer traducido","Datos de acceso menos frecuente.","infrequent access","Menor costo de almacenamiento que Hot, mayor costo de acceso."],
["Azure Storage","Cold tier","Nivel Cold","Datos de acceso todavía menos frecuente.","rarely accessed","Más frío que Cool, pero no offline como Archive."],
["Azure Storage","Archive tier","Nivel Archive / archivo","Datos offline, muy baratos de almacenar y lentos/caros de recuperar.","offline, lowest storage cost, rehydrate","No está disponible inmediatamente."],
["Azure Storage","Blob Storage","Almacenamiento Blob","Almacenamiento de objetos y datos no estructurados.","images, videos, files, unstructured","No es disco de una VM."],
["Azure Storage","Disk Storage","Almacenamiento de discos","Discos administrados para máquinas virtuales.","VM disk, OS disk, data disk","Ligado a cargas de VM."],
["Identity and Access","Microsoft Entra ID","Microsoft Entra ID","Servicio de identidad y autenticación.","users, identities, authentication","No es un DNS ni una red."],
["Identity and Access","Single Sign-On (SSO)","Inicio de sesión único","Una autenticación permite acceder a varias aplicaciones.","sign in once","No agrega un segundo factor."],
["Identity and Access","Multifactor Authentication (MFA)","Autenticación multifactor","Exige uno o más factores adicionales de autenticación.","phone, code, second factor","Conditional Access puede decidir cuándo exigir MFA."],
["Identity and Access","Conditional Access","Acceso condicional","Decide permitir, bloquear o exigir controles según señales como ubicación o riesgo.","location, risk, require MFA","Es la política/decisión, no el segundo factor en sí."],
["Identity and Access","Azure RBAC","Control de acceso basado en roles","Define quién puede hacer qué y sobre qué ámbito.","user + role + scope, permissions","Controla permisos, no cumplimiento de configuración."],
["Identity and Access","Owner","Propietario","Puede administrar recursos y también asignar roles RBAC a otros usuarios.","manage resources + assign roles","Más privilegios que Contributor."],
["Identity and Access","Contributor","Colaborador","Puede crear y administrar recursos, pero no puede asignar roles RBAC a otros usuarios.","manage resources, no role assignment","Si debe administrar recursos sin entregar permisos, piensa en Contributor."],
["Identity and Access","Reader","Lector","Puede ver recursos y su configuración, pero no modificarlos.","view only, read resources","No administra recursos ni permisos."],
["Identity and Access","User Access Administrator","Administrador de acceso de usuario","Permite administrar el acceso de usuarios mediante asignaciones de roles RBAC.","assign roles, manage access","No equivale a administrar todos los recursos como Contributor."],
["Governance","Azure Policy","Directiva de Azure","Impone o audita reglas sobre recursos.","require, deny, compliant","No asigna permisos de usuario; eso es RBAC."],
["Governance","Resource Lock","Bloqueo de recurso","Evita modificación o eliminación accidental.","prevent deletion, prevent changes","Protege contra acciones accidentales."],
["Governance","Tags","Etiquetas","Clasifican recursos y ayudan a organizar costos.","department, project, environment","No imponen reglas."],
["Governance","Azure Cost Management","Administración de costos","Analiza gastos, presupuestos, tendencias e histórico.","budget, historical costs, forecast","Para costos reales y seguimiento."],
["Governance","Azure Pricing Calculator","Calculadora de precios","Estima costos antes de desplegar recursos.","estimate cost before deployment","Estimación previa, no seguimiento histórico."],
["Monitoring and Support","Azure Monitor","Azure Monitor","Recopila métricas, logs y genera alertas de recursos.","CPU, utilization, metrics, logs","Mira tus recursos."],
["Monitoring and Support","Azure Service Health","Estado del servicio de Azure","Informa incidentes y mantenimientos de servicios Azure que pueden afectarte.","outage, service issue, region","Mira la salud de los servicios de Azure."],
["Monitoring and Support","Azure Advisor","Azure Advisor","Entrega recomendaciones de optimización.","recommendations, cost, reliability, performance","Recomienda; no diagnostica una caída regional."],
["Monitoring and Support","Azure Support + Troubleshooting","Soporte y solución de problemas","Ayuda a investigar o resolver problemas.","troubleshoot, support request","Se usa para resolver, no para recibir estado de servicio."],
["Management tools","Azure Portal","Portal de Azure","Interfaz gráfica web para administrar Azure.","GUI, browser","No es una shell."],
["Management tools","Azure Cloud Shell","Azure Cloud Shell","Shell accesible desde navegador con Bash y PowerShell.","browser, Bash, PowerShell","Entorno de línea de comandos alojado en Azure."],
["Management tools","Azure CLI","Azure CLI","Herramienta de línea de comandos para administrar Azure.","az command, Bash","Sintaxis diferente de Azure PowerShell."],
["Management tools","Azure PowerShell","Azure PowerShell","Administración de Azure mediante cmdlets de PowerShell.","PowerShell, cmdlets","Alternativa a Azure CLI."],
["Management tools","ARM Template","Plantilla ARM","Define infraestructura de forma declarativa usando JSON.","declarative JSON, provision resources","No es una herramienta interactiva de comandos."],
["Management tools","Azure Arc","Azure Arc","Extiende administración y gobernanza de Azure a servidores y recursos fuera de Azure.","on-premises, multicloud, without migrating","No requiere migrar el servidor a Azure."]
].map(x=>({category:x[0],term:x[1],es:x[2],meaning:x[3],signal:x[4],compare:x[5]}));function norm(s){return(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}function render(){const q=norm(document.getElementById("q").value.trim()),cat=document.getElementById("cat").value,filtered=entries.filter(e=>{const hay=norm([e.term,e.es,e.meaning,e.signal,e.compare,e.category].join(" "));return(!q||hay.includes(q))&&(!cat||e.category===cat)});document.getElementById("stats").textContent=`${filtered.length} término${filtered.length===1?"":"s"} encontrado${filtered.length===1?"":"s"}`;const grid=document.getElementById("grid");if(!filtered.length){grid.innerHTML='<div class="empty">No encontré coincidencias. Prueba con otro término o pista.</div>';return}grid.innerHTML=filtered.map(e=>`<article class="card"><div class="badge">${e.category}</div><div class="term">${e.term}</div><div class="es">${e.es}</div><div class="label">Qué significa</div><div class="value">${e.meaning}</div><div class="label">Señal típica</div><div class="signal">${e.signal}</div><div class="label">No confundir con</div><div class="value">${e.compare}</div></article>`).join("")}document.getElementById("q").addEventListener("input",render);document.getElementById("cat").addEventListener("change",render);render();</script></body></html>

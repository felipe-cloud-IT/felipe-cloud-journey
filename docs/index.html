<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glosario Fénix Azure</title>
<style>
:root {
  --bg:#0b1220; --panel:#111a2b; --panel2:#172236; --text:#eaf0f7;
  --muted:#9fb0c3; --accent:#67b7ff; --border:#263750; --good:#a6e3a1;
}
* { box-sizing:border-box; }
body {
  margin:0; font-family:Inter,Segoe UI,Arial,sans-serif; background:var(--bg); color:var(--text);
}
header {
  padding:10px 18px 10px; border-bottom:1px solid var(--border);
  background:linear-gradient(180deg,#0f1a2d,#0b1220);
  position:sticky; top:0; z-index:20;
}
.wrap { max-width:1180px; margin:0 auto; }
h1 { margin:0 0 6px; font-size:clamp(22px,2.5vw,30px); }
.subtitle { color:var(--muted); margin:0 0 18px; }
.controls { display:grid; grid-template-columns:1fr 230px; gap:10px; }
input, select {
  width:100%; padding:14px 15px; border-radius:12px; border:1px solid var(--border);
  background:var(--panel); color:var(--text); font-size:16px; outline:none;
}
input:focus, select:focus { border-color:var(--accent); }
main { padding:14px 18px; }
.stats { color:var(--muted); margin-bottom:10px; }
.grid {
  display:grid; grid-template-columns:repeat(auto-fit,minmax(290px,1fr)); gap:14px;
}
.card {
  background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:14px;
  box-shadow:0 10px 30px rgba(0,0,0,.14);
}
.badge {
  display:inline-block; font-size:12px; color:#c9dcf2; background:var(--panel2);
  border:1px solid var(--border); border-radius:999px; padding:5px 9px; margin-bottom:10px;
}
.term { font-size:19px; font-weight:750; margin-bottom:4px; }
.es { color:var(--accent); margin-bottom:12px; }
.label { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin-top:10px; }
.value { margin-top:3px; line-height:1.45; }
.signal {
  margin-top:4px; display:inline-block; color:var(--good); font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
}
.empty { color:var(--muted); padding:35px 0; text-align:center; }
.footer-note { color:var(--muted); font-size:13px; margin:22px 0 8px; }
@media (max-width:700px) {
  .controls { grid-template-columns:1fr; }
  header { position:static; }
}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>Glosario Fénix Azure</h1>
    <div class="controls">
      <input id="q" type="search" placeholder="Buscar término, concepto o pista: Hot, Storage, outage, billing, MFA..." autocomplete="off">
      <select id="cat">
        <option value="">Todas las categorías</option>
        <option>Azure Storage</option><option>Azure architecture</option><option>Cloud concepts</option><option>Cloud service models</option><option>Governance</option><option>Identity and Access</option><option>Management tools</option><option>Monitoring and Support</option><option>Networking</option>
      </select>
    </div>
  </div>
</header>

<main>
  <div class="wrap">
    <div id="stats" class="stats"></div>
    <div id="grid" class="grid"></div>
    <div class="footer-note">Consejo: busca también por la pista de examen, por ejemplo “outage”, “billing”, “more VMs” o “sign in once”.</div>
  </div>
</main>

<script>
const entries = [{"category":"Cloud concepts","term":"Scalability","es":"Escalabilidad","meaning":"Capacidad de aumentar o reducir recursos.","signal":"capacity, growth, demand","compare":"No implica necesariamente ajuste automático."},{"category":"Cloud concepts","term":"Horizontal scaling / Scale out","es":"Escalado horizontal","meaning":"Agregar más instancias o máquinas.","signal":"more instances, more VMs","compare":"Más máquinas, no más potencia a una sola VM."},{"category":"Cloud concepts","term":"Vertical scaling / Scale up","es":"Escalado vertical","meaning":"Aumentar CPU o RAM de una misma máquina.","signal":"more CPU, more RAM","compare":"Más potencia a la misma máquina."},{"category":"Cloud concepts","term":"Elasticity","es":"Elasticidad","meaning":"Ajustar recursos dinámicamente según la demanda.","signal":"automatically, demand increases/decreases","compare":"A diferencia de Scalability, destaca el ajuste dinámico."},{"category":"Cloud concepts","term":"Agility","es":"Agilidad","meaning":"Crear o modificar recursos rápidamente.","signal":"deploy quickly, business requirements","compare":"No es aumentar capacidad; es rapidez para desplegar o cambiar."},{"category":"Cloud concepts","term":"High Availability","es":"Alta disponibilidad","meaning":"Mantener un servicio disponible aunque haya fallos.","signal":"downtime, remains available","compare":"No es recuperación después de un desastre."},{"category":"Cloud concepts","term":"Disaster Recovery","es":"Recuperación ante desastres","meaning":"Recuperar servicios y datos después de un desastre.","signal":"disaster, recovery, backup","compare":"Se centra en recuperación, no solo en continuidad inmediata."},{"category":"Cloud concepts","term":"Geo-distribution","es":"Distribución geográfica","meaning":"Distribuir recursos o datos en distintas ubicaciones.","signal":"around the world, regions","compare":"Busca cercanía, rendimiento o resiliencia geográfica."},{"category":"Cloud service models","term":"IaaS","es":"Infraestructura como servicio","meaning":"Azure entrega infraestructura; el cliente administra OS, aplicaciones y datos.","signal":"VM, OS responsibility","compare":"Más control del cliente."},{"category":"Cloud service models","term":"PaaS","es":"Plataforma como servicio","meaning":"Azure administra la plataforma; el cliente se concentra en aplicación y datos.","signal":"application development, no server management","compare":"Menos administración de infraestructura que IaaS."},{"category":"Cloud service models","term":"SaaS","es":"Software como servicio","meaning":"El cliente usa una aplicación ya preparada y administrada por el proveedor.","signal":"existing application, use software","compare":"Menor responsabilidad técnica del cliente."},{"category":"Azure architecture","term":"Resource","es":"Recurso","meaning":"Elemento individual administrable de Azure.","signal":"VM, VNet, Storage Account","compare":"Es el objeto individual, no el contenedor."},{"category":"Azure architecture","term":"Resource Group","es":"Grupo de recursos","meaning":"Agrupación lógica de recursos relacionados.","signal":"group related resources","compare":"Está dentro de una Subscription."},{"category":"Azure architecture","term":"Subscription","es":"Suscripción","meaning":"Límite administrativo y de facturación.","signal":"billing, invoice","compare":"Contiene Resource Groups."},{"category":"Azure architecture","term":"Management Group","es":"Grupo de administración","meaning":"Agrupa varias subscriptions para gobernanza común.","signal":"multiple subscriptions","compare":"Está por encima de Subscription."},{"category":"Azure architecture","term":"Azure Resource Manager (ARM)","es":"Azure Resource Manager","meaning":"Capa de despliegue y administración de recursos de Azure.","signal":"deploy, manage resources","compare":"No es identidad ni monitorización."},{"category":"Azure architecture","term":"Availability Zone","es":"Zona de disponibilidad","meaning":"Datacenter físicamente separado dentro de una región.","signal":"datacenter failure, same region","compare":"Protege dentro de una región."},{"category":"Azure architecture","term":"Region Pair","es":"Par de regiones","meaning":"Relación entre dos regiones para resiliencia regional.","signal":"regional disaster, secondary region","compare":"Piensa en fallo de una región completa."},{"category":"Networking","term":"Virtual Network (VNet)","es":"Red virtual","meaning":"Red privada lógica dentro de Azure.","signal":"Azure network, private network","compare":"Base de conectividad entre recursos Azure."},{"category":"Networking","term":"VNet Peering","es":"Emparejamiento de redes virtuales","meaning":"Conecta dos VNets para que sus recursos se comuniquen.","signal":"two VNets communicate","compare":"No filtra tráfico; conecta VNets."},{"category":"Networking","term":"VPN Gateway","es":"Puerta de enlace VPN","meaning":"Conecta redes mediante VPN, por ejemplo on-premises con Azure.","signal":"on-premises ↔ Azure, VPN","compare":"Usa túneles VPN."},{"category":"Networking","term":"ExpressRoute","es":"ExpressRoute","meaning":"Conexión privada dedicada entre on-premises y Azure.","signal":"dedicated, private connection","compare":"No depende de una VPN por Internet."},{"category":"Networking","term":"Network Security Group (NSG)","es":"Grupo de seguridad de red","meaning":"Filtra tráfico de red con reglas de entrada y salida.","signal":"allow/deny traffic, ports","compare":"Controla tráfico; no conecta redes."},{"category":"Azure Storage","term":"Hot tier","es":"Nivel Hot / puede aparecer traducido","meaning":"Datos de acceso frecuente.","signal":"frequently accessed, fast access","compare":"Mayor costo de almacenamiento, menor costo de acceso que tiers fríos."},{"category":"Azure Storage","term":"Cool tier","es":"Nivel Cool / puede aparecer traducido","meaning":"Datos de acceso menos frecuente.","signal":"infrequent access","compare":"Menor costo de almacenamiento que Hot, mayor costo de acceso."},{"category":"Azure Storage","term":"Cold tier","es":"Nivel Cold","meaning":"Datos de acceso todavía menos frecuente.","signal":"rarely accessed","compare":"Más frío que Cool, pero no offline como Archive."},{"category":"Azure Storage","term":"Archive tier","es":"Nivel Archive / archivo","meaning":"Datos offline, muy baratos de almacenar y lentos/caros de recuperar.","signal":"offline, lowest storage cost, rehydrate","compare":"No está disponible inmediatamente."},{"category":"Azure Storage","term":"Blob Storage","es":"Almacenamiento Blob","meaning":"Almacenamiento de objetos y datos no estructurados.","signal":"images, videos, files, unstructured","compare":"No es disco de una VM."},{"category":"Azure Storage","term":"Disk Storage","es":"Almacenamiento de discos","meaning":"Discos administrados para máquinas virtuales.","signal":"VM disk, OS disk, data disk","compare":"Ligado a cargas de VM."},{"category":"Identity and Access","term":"Microsoft Entra ID","es":"Microsoft Entra ID","meaning":"Servicio de identidad y autenticación.","signal":"users, identities, authentication","compare":"No es un DNS ni una red."},{"category":"Identity and Access","term":"Single Sign-On (SSO)","es":"Inicio de sesión único","meaning":"Una autenticación permite acceder a varias aplicaciones.","signal":"sign in once","compare":"No agrega un segundo factor."},{"category":"Identity and Access","term":"Multifactor Authentication (MFA)","es":"Autenticación multifactor","meaning":"Exige uno o más factores adicionales de autenticación.","signal":"phone, code, second factor","compare":"Conditional Access puede decidir cuándo exigir MFA."},{"category":"Identity and Access","term":"Conditional Access","es":"Acceso condicional","meaning":"Decide permitir, bloquear o exigir controles según señales como ubicación o riesgo.","signal":"location, risk, require MFA","compare":"Es la política/decisión, no el segundo factor en sí."},{"category":"Identity and Access","term":"Azure RBAC","es":"Control de acceso basado en roles","meaning":"Define quién puede hacer qué y sobre qué ámbito.","signal":"user + role + scope, permissions","compare":"Controla permisos, no cumplimiento de configuración."},{"category":"Governance","term":"Azure Policy","es":"Directiva de Azure","meaning":"Impone o audita reglas sobre recursos.","signal":"require, deny, compliant","compare":"No asigna permisos de usuario; eso es RBAC."},{"category":"Governance","term":"Resource Lock","es":"Bloqueo de recurso","meaning":"Evita modificación o eliminación accidental.","signal":"prevent deletion, prevent changes","compare":"Protege contra acciones accidentales."},{"category":"Governance","term":"Tags","es":"Etiquetas","meaning":"Clasifican recursos y ayudan a organizar costos.","signal":"department, project, environment","compare":"No imponen reglas."},{"category":"Governance","term":"Azure Cost Management","es":"Administración de costos","meaning":"Analiza gastos, presupuestos, tendencias e histórico.","signal":"budget, historical costs, forecast","compare":"Para costos reales y seguimiento."},{"category":"Governance","term":"Azure Pricing Calculator","es":"Calculadora de precios","meaning":"Estima costos antes de desplegar recursos.","signal":"estimate cost before deployment","compare":"Estimación previa, no seguimiento histórico."},{"category":"Monitoring and Support","term":"Azure Monitor","es":"Azure Monitor","meaning":"Recopila métricas, logs y genera alertas de recursos.","signal":"CPU, utilization, metrics, logs","compare":"Mira tus recursos."},{"category":"Monitoring and Support","term":"Azure Service Health","es":"Estado del servicio de Azure","meaning":"Informa incidentes y mantenimientos de servicios Azure que pueden afectarte.","signal":"outage, service issue, region","compare":"Mira la salud de los servicios de Azure."},{"category":"Monitoring and Support","term":"Azure Advisor","es":"Azure Advisor","meaning":"Entrega recomendaciones de optimización.","signal":"recommendations, cost, reliability, performance","compare":"Recomienda; no diagnostica una caída regional."},{"category":"Monitoring and Support","term":"Azure Support + Troubleshooting","es":"Soporte y solución de problemas","meaning":"Ayuda a investigar o resolver problemas.","signal":"troubleshoot, support request","compare":"Se usa para resolver, no para recibir estado de servicio."},{"category":"Management tools","term":"Azure Portal","es":"Portal de Azure","meaning":"Interfaz gráfica web para administrar Azure.","signal":"GUI, browser","compare":"No es una shell."},{"category":"Management tools","term":"Azure Cloud Shell","es":"Azure Cloud Shell","meaning":"Shell accesible desde navegador con Bash y PowerShell.","signal":"browser, Bash, PowerShell","compare":"Entorno de línea de comandos alojado en Azure."},{"category":"Management tools","term":"Azure CLI","es":"Azure CLI","meaning":"Herramienta de línea de comandos para administrar Azure.","signal":"az command, Bash","compare":"Sintaxis diferente de Azure PowerShell."},{"category":"Management tools","term":"Azure PowerShell","es":"Azure PowerShell","meaning":"Administración de Azure mediante cmdlets de PowerShell.","signal":"PowerShell, cmdlets","compare":"Alternativa a Azure CLI."},{"category":"Management tools","term":"ARM Template","es":"Plantilla ARM","meaning":"Define infraestructura de forma declarativa usando JSON.","signal":"declarative JSON, provision resources","compare":"No es una herramienta interactiva de comandos."},{"category":"Management tools","term":"Azure Arc","es":"Azure Arc","meaning":"Extiende administración y gobernanza de Azure a servidores y recursos fuera de Azure.","signal":"on-premises, multicloud, without migrating","compare":"No requiere migrar el servidor a Azure."}];

function norm(s) {
  return (s || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "");
}

function render() {
  const q = norm(document.getElementById("q").value.trim());
  const cat = document.getElementById("cat").value;
  const filtered = entries.filter(e => {
    const hay = norm([e.term,e.es,e.meaning,e.signal,e.compare,e.category].join(" "));
    return (!q || hay.includes(q)) && (!cat || e.category === cat);
  });

  document.getElementById("stats").textContent =
    `${filtered.length} término${filtered.length === 1 ? "" : "s"} encontrado${filtered.length === 1 ? "" : "s"}`;

  const grid = document.getElementById("grid");
  if (!filtered.length) {
    grid.innerHTML = '<div class="empty">No encontré coincidencias. Prueba con otro término o pista.</div>';
    return;
  }

  grid.innerHTML = filtered.map(e => `
    <article class="card">
      <div class="badge">${e.category}</div>
      <div class="term">${e.term}</div>
      <div class="es">${e.es}</div>

      <div class="label">Qué significa</div>
      <div class="value">${e.meaning}</div>

      <div class="label">Señal típica</div>
      <div class="signal">${e.signal}</div>

      <div class="label">No confundir con</div>
      <div class="value">${e.compare}</div>
    </article>
  `).join("");
}

document.getElementById("q").addEventListener("input", render);
document.getElementById("cat").addEventListener("change", render);
render();
</script>
</body>
</html>

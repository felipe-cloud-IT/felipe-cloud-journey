<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Laboratorio Redes Fénix</title><style>
:root{--bg:#0b1220;--panel:#111a2b;--panel2:#172236;--text:#eaf0f7;--muted:#9fb0c3;--accent:#67b7ff;--border:#263750;--good:#a6e3a1;--warn:#ffd166}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
header{padding:14px 18px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,#0f1a2d,#0b1220)}.wrap{max-width:1050px;margin:auto}
h1{margin:0 0 6px;font-size:clamp(24px,3vw,34px)}.sub,.muted{color:var(--muted)}nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
nav a,.btn,select{color:var(--text);text-decoration:none;border:1px solid var(--border);padding:10px 13px;border-radius:10px;background:var(--panel2);cursor:pointer}
nav a.active{border-color:var(--accent);color:var(--accent)}main{padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px}.meta{font-size:13px;color:var(--muted);margin-bottom:10px}
.prompt{font-size:19px;line-height:1.5}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.hint,.answer{display:none;margin-top:12px;padding:12px;border-radius:10px;background:#0b1524;border-left:3px solid var(--warn);white-space:pre-wrap}
.answer{border-left-color:var(--good)}textarea{width:100%;min-height:190px;background:#09101c;color:var(--text);border:1px solid var(--border);border-radius:12px;padding:12px;font:15px/1.5 Consolas,monospace}
.note{font-size:13px;color:var(--muted);line-height:1.5}@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style></head><body><header><div class="wrap"><h1>Laboratorio Redes Fénix</h1><p class="sub">Subnetting, DNS, DHCP, switching, routing y diagnóstico de conectividad.</p>
<nav><a href="./">Inicio</a><a href="labs.html">Laboratorios</a><a href="english-lab.html">Inglés TI</a><a href="troubleshooting-lab.html">Troubleshooting</a><a class="active" href="network-lab.html">Redes</a><a href="powershell-lab.html">PowerShell</a><a href="python-lab.html">Python</a></nav></div></header>
<main><div class="wrap"><div class="grid"><section class="card"><div class="meta"><span id="count"></span> · <span id="area"></span> · <span id="level"></span></div>
<div id="prompt" class="prompt"></div><div class="actions"><button class="btn" id="next">Otro ejercicio</button><button class="btn" id="hintBtn">Pista</button><button class="btn" id="answerBtn">Ver referencia</button></div>
<div id="hint" class="hint"></div><div id="answer" class="answer"></div><p class="note">Primero responde por tu cuenta. La referencia sirve para comparar, no para reemplazar tu razonamiento.</p></section>
<section class="card"><h2>Tu respuesta</h2><textarea id="work" placeholder="Escribe aquí tu respuesta, comando, diagnóstico o razonamiento..."></textarea><div class="actions"><button class="btn" id="clear">Limpiar</button></div></section></div></div></main>
<script>const items=[{"area":"IPv4","level":"Básico","prompt":"¿Cuántas direcciones totales tiene una red /24?","hint":"32 - 24 = 8 bits de host.","answer":"256 direcciones totales."},{"area":"IPv4","level":"Medio","prompt":"Para 192.168.10.0/24, indica red, broadcast y rango típico de hosts.","hint":"Primera = red; última = broadcast.","answer":"Red 192.168.10.0, broadcast 192.168.10.255, hosts 192.168.10.1–192.168.10.254."},{"area":"Subnetting","level":"Medio","prompt":"¿Cuántas direcciones totales contiene una /26?","hint":"32 - 26 = 6 bits.","answer":"64 direcciones totales."},{"area":"Subnetting","level":"Desafío","prompt":"Divide conceptualmente una /24 en cuatro subredes iguales. ¿Qué prefijo resulta?","hint":"Necesitas 2 bits adicionales para 4 subredes.","answer":"/26. Cada subred tiene 64 direcciones totales."},{"area":"DNS","level":"Básico","prompt":"¿Qué servicio traduce nombres como servidor.local a direcciones IP?","hint":"Resolución de nombres.","answer":"DNS."},{"area":"DHCP","level":"Básico","prompt":"¿Qué problema sugiere normalmente una dirección 169.254.x.x en Windows?","hint":"APIPA.","answer":"El equipo no obtuvo una dirección desde DHCP y se autoasignó una APIPA."},{"area":"Gateway","level":"Básico","prompt":"¿Para qué sirve la puerta de enlace predeterminada?","hint":"Salir de la red local.","answer":"Para enviar tráfico hacia redes distintas de la subred local."},{"area":"Switching","level":"Medio","prompt":"¿Qué diferencia básica hay entre un switch y un router?","hint":"LAN/capa 2 frente a interconexión de redes.","answer":"El switch conecta dispositivos dentro de una red/VLAN; el router enruta tráfico entre redes distintas."},{"area":"VLAN","level":"Medio","prompt":"¿Qué objetivo cumple una VLAN?","hint":"Segmentación lógica.","answer":"Separar lógicamente dominios de broadcast sobre una infraestructura de switching compartida."},{"area":"Puertos","level":"Básico","prompt":"¿Qué puerto usa normalmente HTTPS?","hint":"Web cifrada.","answer":"TCP 443."},{"area":"Puertos","level":"Básico","prompt":"¿Qué puerto usa normalmente DNS?","hint":"Consulta estándar.","answer":"UDP 53 principalmente; TCP 53 también se usa según el caso."},{"area":"Diagnóstico","level":"Medio","prompt":"Puedes hacer ping al gateway pero no a 8.8.8.8. ¿Dónde mirarías después?","hint":"Más allá de la LAN local.","answer":"Ruta/salida a Internet, router/firewall, NAT, ISP y rutas aguas arriba."},{"area":"Diagnóstico","level":"Medio","prompt":"Puedes hacer ping a 8.8.8.8 pero no a un nombre. ¿Qué prueba harías?","hint":"nslookup.","answer":"Probar resolución DNS con nslookup/dig y revisar servidores DNS configurados."},{"area":"CIDR","level":"Desafío","prompt":"¿Qué máscara decimal corresponde a /27?","hint":"27 unos: 255.255.255.x","answer":"255.255.255.224."},{"area":"Modelo OSI","level":"Medio","prompt":"Un cable desconectado corresponde principalmente a qué capa OSI?","hint":"Medio físico.","answer":"Capa 1: Física."},{"area":"Modelo OSI","level":"Medio","prompt":"Una VLAN y una MAC address se asocian principalmente a qué capa?","hint":"Ethernet.","answer":"Capa 2: Enlace de datos."},{"area":"Routing","level":"Desafío","prompt":"Dos PCs están en subredes distintas. ¿Qué necesitan para comunicarse?","hint":"Dispositivo de capa 3 y rutas.","answer":"Un router o dispositivo capa 3 con rutas entre ambas redes, además de gateways/configuración adecuados."},{"area":"ARP","level":"Medio","prompt":"¿Qué relaciona ARP en IPv4?","hint":"IP ↔ MAC.","answer":"Relaciona una dirección IPv4 local con una dirección MAC."},{"area":"NAT","level":"Medio","prompt":"¿Para qué se usa NAT habitualmente en una salida a Internet?","hint":"Privadas a pública.","answer":"Traducir direcciones privadas internas a una o más direcciones públicas."},{"area":"Troubleshooting","level":"Desafío","prompt":"Ordena una prueba básica: DNS, enlace físico, gateway, IP local.","hint":"Parte desde lo más cercano al host.","answer":"Enlace físico → IP local → gateway → DNS (y luego destinos externos según el caso)."}];
let current=0;
const countEl=document.getElementById('count');
const areaEl=document.getElementById('area');
const levelEl=document.getElementById('level');
const promptEl=document.getElementById('prompt');
const hintEl=document.getElementById('hint');
const answerEl=document.getElementById('answer');
const nextBtn=document.getElementById('next');
const hintBtn=document.getElementById('hintBtn');
const answerBtn=document.getElementById('answerBtn');
const clearBtn=document.getElementById('clear');
const workEl=document.getElementById('work');

function show(i){
  current=i;
  const x=items[i];
  countEl.textContent='Ejercicio '+(i+1)+'/'+items.length;
  areaEl.textContent=x.area;
  levelEl.textContent=x.level;
  promptEl.textContent=x.prompt;
  hintEl.textContent=x.hint;
  answerEl.textContent=x.answer;
  hintEl.style.display='none';
  answerEl.style.display='none';
  hintBtn.textContent='Pista';
  answerBtn.textContent='Ver referencia';
}
show(0);

nextBtn.addEventListener('click',()=>{
  let n=current;
  while(items.length>1&&n===current)n=Math.floor(Math.random()*items.length);
  show(n);
});
hintBtn.addEventListener('click',()=>{
  const on=hintEl.style.display==='block';
  hintEl.style.display=on?'none':'block';
  hintBtn.textContent=on?'Pista':'Ocultar pista';
});
answerBtn.addEventListener('click',()=>{
  const on=answerEl.style.display==='block';
  answerEl.style.display=on?'none':'block';
  answerBtn.textContent=on?'Ver referencia':'Ocultar referencia';
});
clearBtn.addEventListener('click',()=>{workEl.value='';});
</script></body></html>
